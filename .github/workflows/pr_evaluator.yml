name: Pull Request Assignment Evaluator

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

jobs:
  evaluate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pull Request Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch All Remote Branches & Tags
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' || true
          git fetch --tags origin || true

      - name: Run Autograder Evaluation
        id: run-autograder
        run: |
          python autograder.py > autograder_output.txt || true
          cat autograder_output.txt

      - name: Post Grade Comment on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let output = fs.readFileSync('autograder_output.txt', 'utf8');
            
            const commentBody = `### 📊 Assignment Evaluation Results (@${context.actor})\n\n\`\`\`text\n${output}\n\`\`\`\n\n*Note: This grade report was generated automatically. You may update your code and push to this branch to re-run autograding.*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Assignment Evaluation Results'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
            }
