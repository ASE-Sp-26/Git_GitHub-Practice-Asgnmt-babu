name: Pull Request Assignment Evaluator

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  actions: read

jobs:
  evaluate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pull Request Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch All Remote Branches & Tags
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' || true
          git fetch --tags origin || true

      - name: Run Autograder Evaluation
        id: run-autograder
        run: |
          python autograder.py --no-color > autograder_output.txt || true
          cat autograder_output.txt

      - name: Post Grade Comment on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let output = fs.readFileSync('autograder_output.txt', 'utf8');
            output = output.replace(/\x1B\[[0-9;]*[a-zA-Z]|\^\[\[[0-9;]*[a-zA-Z]|\x1B/g, '');
            
            // Build Markdown Evaluation Table
            const taskWeights = { 1: 15, 2: 15, 3: 20, 4: 20, 5: 15, 6: 15 };
            const taskTitles = {
              1: "Task 1: Git Config & Student Info",
              2: "Task 2: .gitignore Rules",
              3: "Task 3: Branching & Calculator",
              4: "Task 4: Merge Conflict Resolution",
              5: "Task 5: Git Stashing & Tagging",
              6: "Task 6: GitHub Reflection"
            };

            let tableRows = [];
            let totalScore = 0;
            let maxTotal = 100;

            for (let i = 1; i <= 6; i++) {
              const maxPts = taskWeights[i];
              let score = 0;
              const m = output.match(new RegExp(`Task ${i}[^\\n]*?\\n\\s*Score:\\s*(\\d+)/(\\d+)`, 'i')) ||
                        output.match(new RegExp(`Task ${i}[^\\n]*?\\((\\d+)/(\\d+)\\s*pts\\)`, 'i'));
              if (m) {
                score = parseInt(m[1], 10);
              }
              totalScore += score;

              const fbMatch = output.match(new RegExp(`Task ${i}:[^\\n]*\\n((?:[ \\t]*(?:└─|-|•)[^\\n]*\\n?)*)`, 'i'));
              let feedback = "";
              if (fbMatch && fbMatch[1]) {
                feedback = fbMatch[1].split('\n')
                  .map(l => l.replace(/^[ \t]*(?:└─|-|•)\s*/, '').trim())
                  .filter(l => l)
                  .join('<br>');
              }
              if (!feedback) {
                feedback = score === maxPts ? "PASS: Requirement completed." : "FAIL: Requirement incomplete.";
              }

              const status = score === maxPts ? "✅ PASS" : (score > 0 ? "⚠️ PARTIAL" : "❌ FAIL");
              tableRows.push(`| **${taskTitles[i]}** | ${status} | **${score} / ${maxPts} pts** | ${feedback} |`);
            }

            const overallStatus = totalScore === maxTotal ? "✅ PASS" : (totalScore > 0 ? "⚠️ PARTIAL" : "❌ FAIL");
            const pct = Math.floor((totalScore / maxTotal) * 100);

            const commentBody = `### 📊 Assignment Evaluation Results (@${context.actor})

| Task | Status | Score | Feedback |
| :--- | :---: | :---: | :--- |
${tableRows.join('\n')}
| **TOTAL SCORE** | **${overallStatus}** | **${totalScore} / ${maxTotal} pts** | **Grade: ${pct}%** |

<details>
<summary>🔍 Click to view raw autograder log</summary>

\`\`\`text
${output}
\`\`\`

</details>

*Note: This grade report was generated automatically. You may update your code and push to this branch to re-run autograding.*`;
            
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : null;
            if (prNumber) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              
              const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Assignment Evaluation Results'));
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: commentBody
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: commentBody
                });
              }
            } else {
              console.log("No PR payload found for comment creation.");
            }
