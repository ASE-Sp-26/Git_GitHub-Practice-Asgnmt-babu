name: GitHub Classroom Autograding

on:
  - push
  - workflow_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.is_template }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 'Task 1: Git Config & Student Info'
        id: task1
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'Task 1: Git Config & Student Info'
          command: 'python autograder.py --task 1'
          timeout: 10
          max-score: 15

      - name: 'Task 2: .gitignore Configuration'
        id: task2
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'Task 2: .gitignore Configuration'
          command: 'python autograder.py --task 2'
          timeout: 10
          max-score: 15

      - name: 'Task 3: Branching & Feature Calculator'
        id: task3
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'Task 3: Branching & Feature Calculator'
          command: 'python autograder.py --task 3'
          timeout: 10
          max-score: 20

      - name: 'Task 4: Merge Conflict Resolution'
        id: task4
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'Task 4: Merge Conflict Resolution'
          command: 'python autograder.py --task 4'
          timeout: 10
          max-score: 20

      - name: 'Task 5: Git Stashing & Tagging v1.0.0'
        id: task5
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'Task 5: Git Stashing & Tagging v1.0.0'
          command: 'python autograder.py --task 5'
          timeout: 10
          max-score: 15

      - name: 'Task 6: GitHub Reflection & Workflow'
        id: task6
        uses: classroom-resources/autograding-command-grader@v1
        continue-on-error: true
        with:
          test-name: 'Task 6: GitHub Reflection & Workflow'
          command: 'python autograder.py --task 6'
          timeout: 10
          max-score: 15

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        if: ${{ always() }}
        with:
          runners: |
            task1
            task2
            task3
            task4
            task5
            task6
