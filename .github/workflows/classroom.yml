name: Autograding Tests
'on':
- push
- repository_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 'Task 1: Git Config & Student Info'
      id: task-1-git-config-student-info
      uses: classroom-resources/autograding-command-grader@v1
      continue-on-error: true
      with:
        test-name: 'Task 1: Git Config & Student Info'
        setup-command: ''
        command: python autograder.py --task 1
        timeout: 10
        max-score: 15

    - name: 'Task 2: .gitignore Configuration'
      id: task-2-gitignore-configuration
      uses: classroom-resources/autograding-command-grader@v1
      continue-on-error: true
      with:
        test-name: 'Task 2: .gitignore Configuration'
        setup-command: ''
        command: python autograder.py --task 2
        timeout: 10
        max-score: 15

    - name: 'Task 3: Branching & Feature Calculator'
      id: task-3-branching-feature-calculator
      uses: classroom-resources/autograding-command-grader@v1
      continue-on-error: true
      with:
        test-name: 'Task 3: Branching & Feature Calculator'
        setup-command: ''
        command: python autograder.py --task 3
        timeout: 10
        max-score: 20

    - name: 'Task 4: Merge Conflict Resolution'
      id: task-4-merge-conflict-resolution
      uses: classroom-resources/autograding-command-grader@v1
      continue-on-error: true
      with:
        test-name: 'Task 4: Merge Conflict Resolution'
        setup-command: ''
        command: python autograder.py --task 4
        timeout: 10
        max-score: 20

    - name: 'Task 5: Git Stashing & Tagging v1.0.0'
      id: task-5-git-stashing-tagging-v1-0-0
      uses: classroom-resources/autograding-command-grader@v1
      continue-on-error: true
      with:
        test-name: 'Task 5: Git Stashing & Tagging v1.0.0'
        setup-command: ''
        command: python autograder.py --task 5
        timeout: 10
        max-score: 15

    - name: 'Task 6: GitHub Reflection & Workflow'
      id: task-6-github-reflection-workflow
      uses: classroom-resources/autograding-command-grader@v1
      continue-on-error: true
      with:
        test-name: 'Task 6: GitHub Reflection & Workflow'
        setup-command: ''
        command: python autograder.py --task 6
        timeout: 10
        max-score: 15

    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      if: ${{ always() }}
      env:
        TASK-1-GIT-CONFIG-STUDENT-INFO_RESULTS: "${{ steps.task-1-git-config-student-info.outputs.result }}"
        TASK-2-GITIGNORE-CONFIGURATION_RESULTS: "${{ steps.task-2-gitignore-configuration.outputs.result }}"
        TASK-3-BRANCHING-FEATURE-CALCULATOR_RESULTS: "${{ steps.task-3-branching-feature-calculator.outputs.result }}"
        TASK-4-MERGE-CONFLICT-RESOLUTION_RESULTS: "${{ steps.task-4-merge-conflict-resolution.outputs.result }}"
        TASK-5-GIT-STASHING-TAGGING-V1-0-0_RESULTS: "${{ steps.task-5-git-stashing-tagging-v1-0-0.outputs.result }}"
        TASK-6-GITHUB-REFLECTION-WORKFLOW_RESULTS: "${{ steps.task-6-github-reflection-workflow.outputs.result }}"
      with:
        runners: task-1-git-config-student-info,task-2-gitignore-configuration,task-3-branching-feature-calculator,task-4-merge-conflict-resolution,task-5-git-stashing-tagging-v1-0-0,task-6-github-reflection-workflow

    - name: Generate Individual PDF & Moodle Reports
      if: ${{ always() }}
      run: python generate_class_reports.py

    - name: Upload PDF Evaluation Reports & Moodle Gradebook
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: student-evaluation-reports
        path: |
          evaluation_reports/*.pdf
          moodle_consolidated_grades.csv
